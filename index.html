<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Quiz Master</title>
</head>

<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="alert">Alert</div>

    <div class="start-screen">
        <h1 class="logo">Quiz<span class="highlight">Master</span></h1>
        <p>Test your knowledge!</p>
        <button class="btn startBtn">Start Quiz</button>
    </div>

    <!-- Loader -->
    <div class="loader-container" style="display: none;">
        <div class="loader"></div>
        <p>Loading Questions...</p>
    </div>

    <div class="container">
        <header>
            <div class="header-left">
                <span class="badge">Quiz App</span>
            </div>
            <div class="timer">
                <i class="fa-regular fa-clock"></i>
                <span class="time-text">15</span>
            </div>
        </header>

        <div class="quiz-body">
            <h2 class="question"></h2>
            <div class="choices"></div>
        </div>

        <footer>
            <div class="progress-text">Question <span id="current-q">1</span> of <span id="total-q">4</span></div>
            <button class="btn nextBtn">Next <i class="fa-solid fa-arrow-right"></i></button>
        </footer>

        <div class="score-screen" style="display: none;">
            <div class="score-card">
                <i class="fa-solid fa-trophy score-icon"></i>
                <h2>Quiz Completed!</h2>
                <p class="score-text">You scored <span id="user-score">0</span> out of <span id="total-score">0</span>
                </p>
                <button class="btn restartBtn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
